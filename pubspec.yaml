name: apo
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  get_it: ^9.2.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  retrofit: ^4.9.1
  pretty_dio_logger: ^1.4.0
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.3
  flutter_gen_runner: ^5.12.0
  retrofit_generator: ^10.2.0

dependency_overrides:
  analyzer: 8.4.1

flutter_gen:
  output: lib/core/style/assets
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
